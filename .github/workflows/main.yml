name: Deploy Flutter App to Play Store

on:
  pull_request:
    branches:
      - playstore
  push:
    branches:
      - playstore

  # manual trigger if needed
  workflow_dispatch:

jobs:
  build:
    name: Job 1 - Build & Sign Flutter AAB
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v3

      # 2️⃣ Setup Java (needed for Gradle)
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # or your Flutter version

      # 4️⃣ Get dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 5️⃣ Decode keystore and expose env var for build.gradle
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/release.keystore
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore" >> $GITHUB_ENV

      # 6️⃣ Build release app bundle
      - name: Build App Bundle
        run: flutter build appbundle --release

      # 7️⃣ Sign AAB
      - name: Sign AAB
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/bundle/release
          signingKeyBase64: '${{ secrets.KEYSTORE }}'
          alias: '${{ secrets.SIGNING_KEY_ALIAS }}'
          keyStorePassword: '${{ secrets.SIGNING_STORE_PASSWORD }}'
          keyPassword: '${{ secrets.SIGNING_KEY_PASSWORD }}'

      # 8️⃣ Upload artifact for next job
      - name: Upload app bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 2
        continue-on-error: false  # Fail if upload fails


  deploy:
    name: Job_2 - Deploy AAB to playstore
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Download artifact from build job
      - name: Download app bundle from artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: ${{ github.workspace }}
          continue-on-error: false  # Fail if download fails


      # 2️⃣ Upload to Play Store
      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: '${{ secrets.SERVICE_ACCOUNT_JSON }}'
          packageName: com.tonyxlab.echojournal   # <-- your appId
          releaseFiles: ${{ github.workspace }}/app-release.aab
          track: production
          continue-on-error: false  # Fail if deployment fails
