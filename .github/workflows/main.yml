name: "CC Update"

on:
  push:
    branches:
      - cc-update
  pull_request:
    branches:
      - cc-update

env:
  APP_NAME: escroc-app
  NEW_VERSION: v1.2.0          # 🔹 set the new version here
  PREVIOUS_VERSION: v1.1.0     # 🔹 set the previous version here

jobs:
  build:
    name: Build & CC File
    runs-on: macos-latest
    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ Setup Java (needed for Gradle)
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.3'

      # 4️⃣ Get dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 5️⃣ Build APKs (arm64-v8a & armeabi-v7a)
      - name: Build APKs
        run: flutter build apk --target-platform android-arm,android-arm64,android-x64 --split-per-abi

      # 6️⃣ Prepare directory structure
      - name: Prepare folder structure
        run: |
          mkdir -p "${APP_NAME}-${NEW_VERSION}/apk"
          mkdir -p "${APP_NAME}-${NEW_VERSION}/${APP_NAME}-new-${NEW_VERSION}"
          mkdir -p "${APP_NAME}-${NEW_VERSION}/${APP_NAME}-only-updated-files-${PREVIOUS_VERSION}-to-${NEW_VERSION}"

          # copy built apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "${APP_NAME}-${NEW_VERSION}/apk/${APP_NAME}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "${APP_NAME}-${NEW_VERSION}/apk/${APP_NAME}-arm64-v8a.apk"

          # copy full project (exclude build and tool folders)
          rsync -av --exclude '.git' --exclude 'build' --exclude '.dart_tool' --exclude '.gradle' --exclude "${APP_NAME}-${NEW_VERSION}" ./ \
             "${APP_NAME}-${NEW_VERSION}/${APP_NAME}-new-${NEW_VERSION}/"

          # copy only updated files: lib & pubspec.yaml
          mkdir -p "${APP_NAME}-${NEW_VERSION}/${APP_NAME}-only-updated-files-${PREVIOUS_VERSION}-to-${NEW_VERSION}/lib"
          cp -r lib/* \
             "${APP_NAME}-${NEW_VERSION}/${APP_NAME}-only-updated-files-${PREVIOUS_VERSION}-to-${NEW_VERSION}/lib/"
          cp pubspec.yaml \
             "${APP_NAME}-${NEW_VERSION}/${APP_NAME}-only-updated-files-${PREVIOUS_VERSION}-to-${NEW_VERSION}/"
      

      # 7️⃣ Create a zip archive
      - name: Create final zip
        run: |
          zip -r "${APP_NAME}-${NEW_VERSION}.zip" "${APP_NAME}-${NEW_VERSION}"

      # 8️⃣ Upload as GitHub Action artifact for download
      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APP_NAME }}-${{ env.NEW_VERSION }}"
          path: ${{ env.APP_NAME }}-${{ env.NEW_VERSION }}.zip
          retention-days: 7
