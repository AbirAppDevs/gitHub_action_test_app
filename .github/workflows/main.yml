on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

name: "Build & Release"

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest
    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Setup Java
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Install dependencies
      - run: flutter pub get

      # 🔹 Extract app name dynamically from pubspec.yaml
      - name: Set APP_NAME
        run: echo "APP_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_ENV

      # Build APKs
      - run: flutter build apk --release --split-per-abi

      # Rename APKs with dynamic app name
      - run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk  $APP_NAME-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk $APP_NAME-armeabi-v7a.apk
          mv app-x86_64-release.apk     $APP_NAME-x86_64.apk

      # Build iOS IPA
      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r $APP_NAME.ipa Payload

      # Upload to GitHub Release
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*,build/ios/iphoneos/$APP_NAME.ipa"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
