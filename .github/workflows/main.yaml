on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

name: "Build & Release"

env:
  APP_NAME: flutter

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter build apk --release --split-per-abi
      - run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk  $APP_NAME-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk $APP_NAME-armeabi-v7a.apk
          mv app-x86_64-release.apk     $APP_NAME-x86_64.apk

      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r $APP_NAME.ipa Payload

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*,build/ios/iphoneos/$APP_NAME.ipa"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}